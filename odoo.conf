[options]
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
proxy_mode = True
# Which databases each hostname serves is set per-host by nginx through the
# X-Odoo-dbfilter header (dbfilter_from_header, loaded server-wide below);
# dbfilter here is the outer bound -- the header can only narrow it.
# list_db enables the database manager, which nginx 404s publicly: it is only
# reachable through an SSH tunnel to 127.0.0.1:8069. See docs/ops/test-databases.md.
dbfilter = ^(prod|test_.*)$
list_db = True
server_wide_modules = base,web,dbfilter_from_header
workers = 2
max_cron_threads = 1
limit_memory_hard = 1677721600
limit_memory_soft = 629145600
limit_time_cpu = 600
limit_time_real = 1200
log_level = warn


