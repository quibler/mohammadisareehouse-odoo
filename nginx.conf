upstream odoo {
    server 127.0.0.1:8069;
}
upstream odoochat {
    server 127.0.0.1:8072;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate-limit bucket for login attempts (see location = /web/login below).
limit_req_zone $binary_remote_addr zone=odoo_login:10m rate=20r/m;

server {
    server_name erp.mohammadisareehouse.com www.erp.mohammadisareehouse.com;
    # After running: certbot --nginx -d mohammadisareehouse.com
    # certbot will add an HTTPS server block and redirect here automatically.
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;
    client_max_body_size 200m;
    access_log /var/log/nginx/odoo.access.log;
    error_log  /var/log/nginx/odoo.error.log;

    # --- Security hardening, added 2026-08-29 after cryptominer compromise ---
    # Blocks Odoo's database-manager UI and the legacy XML-RPC/JSON-RPC APIs.
    #
    # /xmlrpc/2/db exposes restore(), drop(), create(), dump() and
    # change_admin_password(), gated ONLY by the Odoo master password. A crafted
    # dump passed to restore() can carry `COPY ... FROM PROGRAM`, which executes
    # shell commands as the Postgres superuser -- the entry vector used to plant
    # the miner in /var/lib/postgresql/.dbus/ on 2026-08-27.
    #
    # Verified safe to block: across all retained nginx logs, 100% of requests to
    # these paths came from attack tooling (User-Agent "poc-suite/1.0" from
    # 77.239.124.107, and "Go-http-client/1.1" from 45.198.224.93 -- the miner's
    # own C2 address). Legitimate POS/web traffic uses /web/dataset/call_kw,
    # /websocket, /web/login, /web/image and /odoo exclusively -- never these.
    location ~ ^/(web/database|xmlrpc|jsonrpc) {
        access_log /var/log/nginx/odoo.blocked.log;
        return 404;
    }

    # Slow down credential brute-forcing against the login form.
    # 20 req/min per IP, burst 30 -- far above real usage (~30 hits/day total).
    location = /web/login {
        limit_req zone=odoo_login burst=30 nodelay;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        proxy_pass http://odoo;
        proxy_buffering off;
    }

    location /websocket {
        proxy_pass http://odoochat;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        proxy_pass http://odoo;
        proxy_buffering off;
    }
    gzip on;
    gzip_types text/css text/scss text/plain text/xml application/xml application/json application/javascript;
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/erp.mohammadisareehouse.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/erp.mohammadisareehouse.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.erp.mohammadisareehouse.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    if ($host = erp.mohammadisareehouse.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    listen 80;
    server_name erp.mohammadisareehouse.com www.erp.mohammadisareehouse.com;
    return 404; # managed by Certbot
}
